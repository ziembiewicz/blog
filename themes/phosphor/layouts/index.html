{{ define "main" }}
{{ $pager := .Paginate (where .Site.RegularPages "Section" "posts") }}
<div class="main-head"><h1 class="glow">HOME</h1>{{ partial "rows.html" (dict "pager" $pager "site" .Site) }}</div>
<div class="cards">
  {{ range $pager.Pages }}{{ partial "post-card.html" . }}{{ end }}
</div>
{{ partial "pagination.html" $pager }}
{{ end }}
